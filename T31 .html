<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>T31 役男簽到系統 (2026)</title>
    <!-- 引入 SheetJS 處理 Excel 匯出 -->
    <script src="cdn.sheetjs.com"></script>
    <style>
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 25px; border-bottom: 2px solid #e8f0fe; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #3c4043; }
        select { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 6px; font-size: 16px; outline: none; }
        select:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit { background: #1a73e8; color: white; }
        .btn-submit:hover { background: #1557b0; }
        .btn-export { background: #34a853; color: white; margin-top: 20px; }
        .btn-export:hover { background: #2d8e47; }
        .status-msg { text-align: center; margin-top: 10px; font-size: 14px; color: #5f6368; }
    </style>
</head>
<body>

<div class="container">
    <h2>T31 役男管理系統 (2026)</h2>
    <form id="signForm">
        <div class="form-group">
            <label>役男姓名</label>
            <select id="name" required>
                <option value="">-- 請選擇役男 --</option>
                <option>張維哲</option><option>何弼君</option><option>梁維麟</option>
                <option>張庭毅</option><option>張志豪</option><option>謝僑訓</option>
                <option>黃書偉</option><option>許瑋倫</option><option>蔣博丞</option>
                <option>黃昱富</option><option>蔡岳柏</option><option>賴永杰</option>
                <option>梁富瑋</option><option>呂學瑋</option>
            </select>
        </div>

        <div class="form-group">
            <label>狀態點選</label>
            <select id="status" required>
                <option value="簽到">簽到 (AM)</option>
                <option value="簽退">簽退 (PM)</option>
            </select>
        </div>

        <div class="form-group">
            <label>假別狀況</label>
            <select id="leaveType" required>
                <option value="正常出勤">正常出勤</option>
                <option value="事假">事假</option>
                <option value="病假">病假</option>
                <option value="公假">公假</option>
                <option value="補休">補休</option>
                <option value="罰勤">罰勤</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">提交單筆資料並上傳</button>
    </form>
    
    <div id="statusMsg" class="status-msg"></div>
    
    <button onclick="exportToExcel()" class="btn-export">彙整並下載 Excel 報表</button>
</div>

<script>
    // 1. 請填入您從 Google Apps Script 取得的部署網址
    const SCRIPT_URL = 'https://docs.google.com/spreadsheets/d/1zYxb_OjDAfvlvyK8EN3_7f8l1Utn1jhUS0XIH761Ipw/edit?gid=0#gid=0';
    
    // 用於儲存「單次作業」中的多筆彙整紀錄
    let sessionData = [];

    document.getElementById('signForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const msgDiv = document.getElementById('statusMsg');
        msgDiv.innerText = '資料上傳中...';

        const record = {
            name: document.getElementById('name').value,
            status: document.getElementById('status').value,
            leaveType: document.getElementById('leaveType').value,
            time: new Date().toLocaleString('zh-TW', { hour12: false })
        };

        // A. 儲存至雲端資料庫 (Google Sheets)
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(record)
        }).then(() => {
            msgDiv.innerText = '單筆上傳成功！';
            // B. 彙整至本地清單
            sessionData.push(record);
            this.reset();
        }).catch(err => {
            msgDiv.innerText = '錯誤：' + err;
        });
    });

    // C. 將多筆紀錄彙整後下載為 Excel
    function exportToExcel() {
        if (sessionData.length === 0) {
            alert('目前沒有已提交的彙整資料。');
            return;
        }

        const ws = XLSX.utils.json_to_sheet(sessionData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "T31簽到統計");

        // 自動儲存檔案，檔名包含 2026 日期
        const date = new Date().toISOString().split('T')[0];
        XLSX.writeFile(wb, `T31_Attendance_2026_${date}.xlsx`);
    }
</script>

</body>
</html>
